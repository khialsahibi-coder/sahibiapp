workflows:
  android-apk:
    name: Android APK
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Generate Android platform files
        script: flutter create --platforms=android --org com.sahibi.vision --project-name sahibi_vision_ai_studio .
      - name: Get packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
