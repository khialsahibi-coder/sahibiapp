name: sahibi_vision_ai_studio
description: Sahibi Vision AI Studio - script, voice, subtitles, video editing, generative clips and 1080p export for Android.
publish_to: 'none'
version: 1.1.0+5

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.2
  record: ^5.2.0
  audioplayers: ^6.1.0
  speech_to_text: ^7.0.0
  file_picker: ^8.1.4
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  video_player: ^2.9.2
  ffmpeg_kit_flutter_new: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

# record 5.x pulls an old Linux add-on that no longer matches the current
# platform interface; this forces the fixed version (Linux code is unused on Android).
dependency_overrides:
  record_linux: ^1.3.1

flutter:
  uses-material-design: true
